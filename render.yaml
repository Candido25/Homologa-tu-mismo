services:
  - type: web
    name: homologa-tu-mismo
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
