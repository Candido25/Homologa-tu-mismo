name: Validar base PostgreSQL portable

on:
  pull_request:
    paths:
      - "database/**"
      - "src/**"
      - "scripts/verify-local-document-flow.mjs"
      - "scripts/verify-local-isolation.mjs"
      - "scripts/verify-local-retention.mjs"
      - "compose.yaml"
      - "next.config.ts"
      - "package.json"
      - ".github/workflows/validar-base-portable.yml"
  push:
    branches:
      - main
    paths:
      - "database/**"
      - "src/**"
      - "scripts/verify-local-document-flow.mjs"
      - "scripts/verify-local-isolation.mjs"
      - "scripts/verify-local-retention.mjs"
      - "compose.yaml"
      - "next.config.ts"
      - "package.json"
      - ".github/workflows/validar-base-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_DB: homologa
          POSTGRES_USER: homologa
          POSTGRES_PASSWORD: homologa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homologa -d homologa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: homologa_ci_only
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: homologa
      PGUSER: homologa
      DATABASE_URL: postgresql://homologa:homologa_ci_only@localhost:5432/homologa
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_ENV: local
      AUTH_PROVIDER: local-test
      DATABASE_PROVIDER: postgres
      STORAGE_PROVIDER: azurite
      LOCAL_TEST_USER_ID: 00000000-0000-4000-8000-000000000001
      AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
      AZURE_STORAGE_CASE_DOCUMENTS_CONTAINER: case-documents
      AZURE_STORAGE_GENERATED_REPORTS_CONTAINER: generated-reports
      DOCUMENT_RETENTION_DAYS: "30"
      DOCUMENT_UPLOAD_UI_ENABLED: "true"
      DOCUMENT_RETENTION_JOB_TOKEN: local-retention-job-test-only

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Aplicar migración portable
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0001_portable_core.sql

      - name: Comprobar idempotencia
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0001_portable_core.sql

      - name: Cargar referencias y datos ficticios
        run: |
          psql -v ON_ERROR_STOP=1 -f database/seeds/0001_reference_data.sql
          psql -v ON_ERROR_STOP=1 -f database/seeds/9000_local_test_fixtures.sql

      - name: Verificar estructura y propietarios
        run: |
          test "$(psql -Atc "select count(*) from schema_migrations where version = '0001_portable_core';")" = "1"
          test "$(psql -Atc "select count(*) from app_users;")" = "2"
          test "$(psql -Atc "select count(*) from cases where user_id = '00000000-0000-4000-8000-000000000001';")" = "1"
          test "$(psql -Atc "select count(*) from cases where user_id = '00000000-0000-4000-8000-000000000002';")" = "1"

      - name: Validar aislamiento de expedientes ficticios
        run: npm run security:verify-local

      - name: Iniciar Azurite
        run: |
          docker run --detach --rm \
            --name homologa-azurite-ci \
            --network host \
            mcr.microsoft.com/azure-storage/azurite:3.36.0 \
            azurite-blob \
            --blobHost 127.0.0.1 \
            --skipApiVersionCheck \
            --disableTelemetry
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:10000/devstoreaccount1; then
              exit 0
            fi
            sleep 1
          done
          docker logs homologa-azurite-ci
          exit 1

      - name: Verificar tipos
        run: npm run typecheck

      - name: Iniciar aplicación local
        run: |
          npm run build
          npm run start > /tmp/homologa-next.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/homologa-next.log
          exit 1

      - name: Validar almacenamiento y flujo documental ficticio
        run: |
          npm run storage:verify
          npm run documents:verify-local
          npm run retention:verify-local

      - name: Rechazar documento con propietario incorrecto
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into documents (
            case_id,
            user_id,
            document_type_code,
            storage_provider,
            storage_container,
            storage_path,
            original_filename,
            mime_type,
            size_bytes
          ) values (
            '10000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            'degree',
            'azurite',
            'case-documents',
            'invalid-owner/test.pdf',
            'test.pdf',
            'application/pdf',
            10
          );
          SQL
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "La base permitió asociar un documento al propietario equivocado."
            exit 1
          fi

          echo "La restricción de propietario funcionó correctamente."
