name: Migrar PostgreSQL Azure

on:
  workflow_dispatch:
    inputs:
      seedReferenceData:
        description: 'Aplicar países y tipos documentales de referencia'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: azure-postgres-migration-development
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar migraciones portables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development-database
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_POSTGRES_SERVER_NAME: ${{ vars.AZURE_POSTGRES_SERVER_NAME }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validar destino
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_RESOURCE_GROUP" || { echo "Falta AZURE_RESOURCE_GROUP."; exit 1; }
          test -n "$AZURE_POSTGRES_SERVER_NAME" || { echo "Falta AZURE_POSTGRES_SERVER_NAME."; exit 1; }
          test -n "$AZURE_KEY_VAULT_NAME" || { echo "Falta AZURE_KEY_VAULT_NAME."; exit 1; }

      - name: Iniciar sesión en Azure con OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Abrir firewall temporal
        id: firewall
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
            echo "No se pudo determinar una IPv4 válida para el runner."
            exit 1
          }
          rule_name="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az postgres flexible-server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_POSTGRES_SERVER_NAME" \
            --rule-name "$rule_name" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Obtener conexión desde Key Vault
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(az keyvault secret show \
            --vault-name "$AZURE_KEY_VAULT_NAME" \
            --name database-url \
            --query value \
            --output tsv)"
          test -n "$database_url" || { echo "Key Vault devolvió una conexión vacía."; exit 1; }
          echo "::add-mask::$database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"

      - name: Aplicar migraciones
        shell: bash
        run: |
          set -euo pipefail
          arguments=()
          if [ "${{ inputs.seedReferenceData }}" = "true" ]; then
            arguments+=(--seed-reference)
          fi
          npm run db:migrate:portable -- "${arguments[@]}"

      - name: Cerrar firewall temporal
        if: always() && steps.firewall.outputs.rule_name != ''
        shell: bash
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_POSTGRES_SERVER_NAME" \
            --rule-name "${{ steps.firewall.outputs.rule_name }}" \
            --yes \
            --output none

      - name: Publicar resumen
        if: success()
        shell: bash
        run: |
          {
            echo "## Migración PostgreSQL"
            echo
            echo "- Servidor: \`$AZURE_POSTGRES_SERVER_NAME\`"
            echo "- Migraciones: aprobadas"
            echo "- Datos de referencia: \`${{ inputs.seedReferenceData }}\`"
            echo "- Firewall temporal: cerrado"
          } >> "$GITHUB_STEP_SUMMARY"
