projects:
  - name: Homologa Tú Mismo
    environments:
      - name: Production
        services:
          - type: web
            name: homologa-tu-mismo
            runtime: node
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: checksPass
            buildCommand: npm install && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_VERSION
                value: 22.18.0
              - key: NEXT_TELEMETRY_DISABLED
                value: "1"
              - key: DOCUMENT_RETENTION_DAYS
                value: "30"
              - key: AI_PROVIDER
                value: disabled
              - key: NEXT_PUBLIC_SUPABASE_URL
                sync: false
              - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
                sync: false
